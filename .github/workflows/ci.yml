name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Release APK (unsigned) and size check (<= 8 MB)
        run: |
          ./gradlew assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "Release APK: $APK = $SIZE bytes"
          test "$SIZE" -le 8388608

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-controller-debug-apk
          path: app/build/outputs/apk/debug/*.apk
